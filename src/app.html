<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			const d = matchMedia('(prefers-color-scheme: dark)').matches;
			let s;
			try {
				s = localStorage.getItem('theme');
			} catch {}
			document.documentElement.dataset.theme =
				s === 'light' || s === 'dark' ? s : d ? 'dark' : 'light';
		</script>
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.avif" />
		<link rel="icon" type="image/avif" sizes="32x32" href="/favicon-32x32.avif" />
		<link rel="icon" type="image/avif" sizes="16x16" href="/favicon-16x16.avif" />
		<link rel="manifest" href="/site.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
